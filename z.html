    /*  */

    /* 📊  */
    .eq-container {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 16px;
    }

    .eq-bar {
      width: 3px;
      height: 100%;
      background: linear-gradient(to top, #3a86ff, #00d2ff);
      border-radius: 3px;
      transform-origin: bottom;
      transform: scaleY(0.2);
      transition: transform 0.2s ease;
    }

    .eq-container.playing .eq-bar:nth-child(1) { animation: eqBounce 0.6s infinite alternate ease-in-out; }
    .eq-container.playing .eq-bar:nth-child(2) { animation: eqBounce 0.4s infinite alternate ease-in-out 0.1s; }
    .eq-container.playing .eq-bar:nth-child(3) { animation: eqBounce 0.7s infinite alternate ease-in-out 0.2s; }
    .eq-container.playing .eq-bar:nth-child(4) { animation: eqBounce 0.5s infinite alternate ease-in-out 0.15s; }
    .eq-container.playing .eq-bar:nth-child(5) { animation: eqBounce 0.8s infinite alternate ease-in-out 0.05s; }

    @keyframes eqBounce {
      0% { transform: scaleY(0.15); }
      100% { transform: scaleY(1); }

    function updateClock() {

    function playOnDemand(index) {

        playIcon.className = "fas fa-play";

        document.getElementById('artist-name').innerText = track.artist;

        if (hls) { hls.detachMedia(); }
        const coverBox = document.getElementById('mp3-cover-box');

        if (track.isTextOnly) {
          audio.src = track.fileUrl; audio.load(); audio.play().catch(e => console.log(e));

          if (coverBox && track.coverUrl) {

        } else {
          if (coverBox) coverBox.style.display = 'none'; 
          if (videoElement) {
            videoElement.style.display = 'block';
            videoElement.src = track.fileUrl; 
            videoElement.load(); 
            
            // 🔥 ΚΛΕΙΔΙ: Το βίντεο ξεκινάει με ήχο κανονικά στο ΜΑΞ!

        const chatFrame = document.getElementById('embedded-chat');
        if (chatFrame) chatFrame.style.display = 'block';

    function copyRadioLink() {
      const currentLink = window.location.href;
      const btnText = document.getElementById('share-btn-text');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(currentLink).then(() => { showSuccessMessage(btnText); }).catch(() => { fallbackCopy(currentLink, btnText); });
      } else { fallbackCopy(currentLink, btnText); }
    }

    function fallbackCopy(text, element) {
      const textArea = document.createElement("textarea");
      textArea.value = text; textArea.style.position = "fixed"; document.body.appendChild(textArea);
      textArea.focus(); textArea.select();
      try { document.execCommand('copy'); showSuccessMessage(element); } catch (err) {}
      document.body.removeChild(textArea);
    }

    function showSuccessMessage(element) {
      if (element) { element.innerText = "Αντιγράφηκε! ✅"; setTimeout(() => { element.innerText = "Share"; }, 2000); }
    }              
       // 🎨 Απόλυτη Λειτουργία που αλλάζει live το Theme σε ΟΛΑ τα εσωτερικά κουτιά (Play/Volume/Chat/Controls)!
    function changePlayerTheme(bodyGradient, containerGradient) {
        // 1. Αλλάζουμε το gradient έξω από τον Player (body)
        document.body.style.setProperty('background', bodyGradient, 'important');
        
        // 2. Εντοπίζουμε το κεντρικό κουτί του Player
        const playerBox = document.querySelector('.container') || document.querySelector('.player-container') || document.body.querySelector('div');
        if (playerBox) {
            playerBox.style.setProperty('background', containerGradient, 'important');
        }

        // 3. 🔥 ΚΛΕΙΔΙ: Εντοπίζουμε live το εσωτερικό κουτί των controls (Play, Volume, Chat, Λίστα) και του αλλάζουμε το Theme!
        const controlsBox = document.querySelector('.controls') || document.querySelector('.buttons') || document.querySelector('.volume-container');
        if (controlsBox) {
            controlsBox.style.setProperty('background', containerGradient, 'important');
            controlsBox.style.setProperty('background-color', 'transparent', 'important'); // Το κάνουμε διάφανο για να πάρει το σωστό gradient!
        }
        
        // 4. Εξασφαλίζουμε ότι και τα υπόλοιπα γειτονικά εσωτερικά div (όπως η κοινωνική δικτύωση) θα εναρμονιστούν
        const socialBox = document.querySelector('.social-box');
        if (socialBox) {
            socialBox.style.setProperty('background', 'transparent', 'important');
        }
    }
   // 📺 Live Ρύθμιση της Έντασης του Κεντρικού Βίντεο από την Όρθια Μπάρα
    document.addEventListener("DOMContentLoaded", () => {
        const videoVolBar = document.getElementById('video-volume-bar');
        if (videoVolBar && videoElement) {
            videoVolBar.addEventListener('input', (e) => {
                const vol = e.target.value;
                videoElement.volume = vol;
                
                const muteIcon = document.getElementById('video-mute-icon');
                if (vol > 0) {
                    videoElement.muted = false;
                    if (muteIcon) muteIcon.className = "fas fa-volume-up";
                } else {
                    videoElement.muted = true;
                    if (muteIcon) muteIcon.className = "fas fa-volume-mute";
                }
            });
        }
    });

    function closePlaylistAndReturn() {
        const playlistPanel = document.getElementById('embedded-playlist');

        // 🔓 Κλείνουμε το παράθυρο της λίστας
        if (playlistPanel) {

        if (videoElement) {

        }
        if (chatFrame) {
            chatFrame.style.display = 'block';
        }
    }

    // Για ασφάλεια, αν η HTML καλέσει το όνομα closePlaylist, εκτελείται η ίδια λειτουργία
    function closePlaylist() {
        closePlaylistAndReturn();
